name: iOS PEAR App

# Builds the REAL OpenClaw node app (apps/ios) as PEAR and ships it to TestFlight.
# Supersedes the generated-shell lane in ios-hello-testflight.yml.

on:
  push:
    branches:
      - pear-ios-hello-testflight
    paths:
      - .github/workflows/ios-pear-app.yml
      - apps/ios/**
      - apps/shared/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-pear-app
  cancel-in-progress: true

jobs:
  build-upload:
    name: Build and Upload PEAR app
    runs-on: macos-26
    timeout-minutes: 90
    env:
      BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
      TEAM_ID: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
      MARKETING_VERSION: "2026.7.8"
      BUILD_NUMBER: ${{ github.run_number }}
    defaults:
      run:
        working-directory: apps/ios

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Validate secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in BUNDLE_ID TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_CONTENT; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required secret/env: ${name}"
              exit 1
            fi
          done

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          echo "Available Xcodes:"; ls -d /Applications/Xcode*.app 2>/dev/null || true
          XC="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [[ -z "${XC}" ]]; then
            XC="$(ls -d /Applications/Xcode_2*.app 2>/dev/null | sort -V | tail -1 || true)"
          fi
          if [[ -z "${XC}" ]]; then
            XC="/Applications/Xcode.app"
          fi
          echo "Selecting ${XC}"
          sudo xcode-select -s "${XC}"
          xcodebuild -version

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen swiftlint swiftformat
          gem install fastlane --no-document

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-swiftpm-pear-ios-${{ hashFiles('apps/ios/project.yml') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-pear-ios-

      - name: Configure signing and versions
        shell: bash
        run: |
          set -euo pipefail
          cat > LocalSigning.xcconfig <<EOF
          OPENCLAW_CODE_SIGN_STYLE = Automatic
          OPENCLAW_DEVELOPMENT_TEAM = ${TEAM_ID}
          OPENCLAW_APP_BUNDLE_ID = ${BUNDLE_ID}
          OPENCLAW_SHARE_BUNDLE_ID = ${BUNDLE_ID}.share
          OPENCLAW_WATCH_APP_BUNDLE_ID = ${BUNDLE_ID}.watchkitapp
          OPENCLAW_WATCH_EXTENSION_BUNDLE_ID = ${BUNDLE_ID}.watchkitapp.extension
          OPENCLAW_APP_PROFILE =
          OPENCLAW_SHARE_PROFILE =
          MARKETING_VERSION = ${MARKETING_VERSION}
          CURRENT_PROJECT_VERSION = ${BUILD_NUMBER}
          EOF
          echo "LocalSigning.xcconfig:"
          cat LocalSigning.xcconfig

      - name: Brand as PEAR, trim to phone-only, set versions
        shell: bash
        run: |
          set -euo pipefail
          # Display name
          sed -i '' 's/CFBundleDisplayName: OpenClaw Share/CFBundleDisplayName: PEAR Share/' project.yml
          sed -i '' 's/CFBundleDisplayName: OpenClaw$/CFBundleDisplayName: PEAR/' project.yml
          # v1 is the bare phone app: drop watch (watchOS profile materialization
          # is flaky on clean CI runners) and the share extension (needs its own
          # App ID + distribution profile). Both return in P1.x.
          sed -i '' '/- target: OpenClawWatchApp/d' project.yml
          sed -i '' '/- target: OpenClawShareExtension/{N;d;}' project.yml
          # No push in v1 (the hosted push relay only accepts official OpenClaw
          # builds) — an empty entitlements file avoids needing the Push
          # Notifications capability on the App ID at export time.
          cat > Sources/OpenClaw.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict/>
          </plist>
          EOF
          # Feb-marathon lesson, relearned: a pinned CODE_SIGN_IDENTITY forces
          # every ephemeral runner to mint a fresh Development cert until the
          # account hits Apple's cert cap. Removing it lets cloud signing
          # reuse managed certificates.
          sed -i '' '/^CODE_SIGN_IDENTITY/d' Config/Signing.xcconfig
          # TestFlight needs unique, increasing versions; project.yml hardcodes them.
          sed -i '' "s/CFBundleShortVersionString: \"[^\"]*\"/CFBundleShortVersionString: \"${MARKETING_VERSION}\"/g" project.yml
          sed -i '' "s/CFBundleVersion: \"[^\"]*\"/CFBundleVersion: \"${BUILD_NUMBER}\"/g" project.yml
          grep -n "CFBundleDisplayName\|CFBundleVersion\|OpenClawWatchApp" project.yml | head -20

      - name: Generate Xcode project
        shell: bash
        run: xcodegen generate

      - name: Debug resolved signing settings
        shell: bash
        run: |
          set -euo pipefail
          ls -la LocalSigning.xcconfig .local-signing.xcconfig 2>/dev/null || true
          xcodebuild -showBuildSettings -project OpenClaw.xcodeproj -scheme OpenClaw 2>/dev/null \
            | grep -E "PRODUCT_BUNDLE_IDENTIFIER|OPENCLAW_APP_BUNDLE_ID|MARKETING_VERSION|CURRENT_PROJECT_VERSION|DEVELOPMENT_TEAM" | head -10 || true

      - name: Prepare provisioning profile directories
        shell: bash
        run: |
          # Fresh runners lack these; automatic signing then fails with
          # "Build input file cannot be found: ....mobileprovision".
          mkdir -p "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

      - name: Prepare App Store Connect key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/private_keys"
          python3 - <<'PY'
          import base64, os
          raw = os.environ["ASC_KEY_CONTENT"].strip()
          key = raw.replace("\\n", "\n") if "BEGIN PRIVATE KEY" in raw else base64.b64decode(raw).decode()
          if not key.endswith("\n"):
              key += "\n"
          path = os.path.expanduser(f"~/private_keys/AuthKey_{os.environ['ASC_KEY_ID']}.p8")
          with open(path, "w") as f:
              f.write(key)
          os.chmod(path, 0o600)
          PY
          echo "ASC_KEY_PATH=$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Build and upload to TestFlight
        shell: bash
        env:
          IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
          ASC_KEY_PATH: ${{ env.ASC_KEY_PATH }}
          OPENCLAW_XCARGS_EXTRA: "PRODUCT_BUNDLE_IDENTIFIER=${{ secrets.IOS_BUNDLE_ID }} MARKETING_VERSION=2026.7.8 CURRENT_PROJECT_VERSION=${{ github.run_number }}"
          # pilot reads the Appfile's upstream app_identifier otherwise.
          PILOT_APP_IDENTIFIER: ${{ secrets.IOS_BUNDLE_ID }}
        run: fastlane beta
