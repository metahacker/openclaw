name: iOS Hello TestFlight

on:
  push:
    branches:
      - pear-ios-hello-testflight
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-upload:
    name: Build and Upload
    runs-on: macos-15
    timeout-minutes: 60
    env:
      BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
      TEAM_ID: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
      MARKETING_VERSION: "2026.7.5"
      BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Validate secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in BUNDLE_ID TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_CONTENT; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required secret/env: ${name}"
              exit 1
            fi
          done

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d /Applications/Xcode_16.4.app ]]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app
          elif [[ -d /Applications/Xcode_16.3.app ]]; then
            sudo xcode-select -s /Applications/Xcode_16.3.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen
          gem install fastlane --no-document

      - name: Prepare App Store Connect key
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          raw = os.environ["ASC_KEY_CONTENT"].strip()
          if "BEGIN PRIVATE KEY" in raw:
              key = raw.replace("\\n", "\n")
          else:
              key = base64.b64decode(raw).decode("utf-8")
          if not key.endswith("\n"):
              key += "\n"

          private_dir = Path.home() / ".appstoreconnect" / "private_keys"
          private_dir.mkdir(parents=True, exist_ok=True)
          key_path = private_dir / f"AuthKey_{os.environ['ASC_KEY_ID']}.p8"
          key_path.write_text(key, encoding="utf-8")
          key_path.chmod(0o600)

          api_json = Path.cwd() / "asc-api-key.json"
          api_json.write_text(json.dumps({
              "key_id": os.environ["ASC_KEY_ID"],
              "issuer_id": os.environ["ASC_ISSUER_ID"],
              "key": key,
          }), encoding="utf-8")
          api_json.chmod(0o600)

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"ASC_KEY_PATH={key_path}\n")
              env.write(f"ASC_API_JSON={api_json}\n")
          PY

      - name: Generate hello app
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/openclaw-ios-hello
          mkdir -p /tmp/openclaw-ios-hello/Sources
          cd /tmp/openclaw-ios-hello

          cp -R "$GITHUB_WORKSPACE/apps/ios/Sources/Assets.xcassets" Sources/Assets.xcassets

          cat > project.yml <<EOF
          name: OpenClawHello
          options:
            bundleIdPrefix: ai.openclaw
            deploymentTarget:
              iOS: "17.0"
          settings:
            base:
              DEVELOPMENT_TEAM: "${TEAM_ID}"
              CODE_SIGN_STYLE: Automatic
              MARKETING_VERSION: "${MARKETING_VERSION}"
              CURRENT_PROJECT_VERSION: "${BUILD_NUMBER}"
              SWIFT_VERSION: "6.0"
          schemes:
            OpenClawHello:
              shared: true
              build:
                targets:
                  OpenClawHello: all
          targets:
            OpenClawHello:
              type: application
              platform: iOS
              sources:
                - path: Sources
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: "${BUNDLE_ID}"
                  PRODUCT_NAME: OpenClaw
                  INFOPLIST_FILE: Sources/Info.plist
                  TARGETED_DEVICE_FAMILY: "1"
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
          EOF

          cat > Sources/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>$(DEVELOPMENT_LANGUAGE)</string>
            <key>CFBundleDisplayName</key>
            <string>OpenClaw</string>
            <key>CFBundleExecutable</key>
            <string>$(EXECUTABLE_NAME)</string>
            <key>CFBundleIdentifier</key>
            <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>$(PRODUCT_NAME)</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>$(MARKETING_VERSION)</string>
            <key>CFBundleVersion</key>
            <string>$(CURRENT_PROJECT_VERSION)</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>UILaunchScreen</key>
            <dict/>
            <key>UISupportedInterfaceOrientations</key>
            <array>
              <string>UIInterfaceOrientationPortrait</string>
            </array>
          </dict>
          </plist>
          EOF

          cat > Sources/OpenClawHelloApp.swift <<'EOF'
          import SwiftUI

          @main
          struct OpenClawHelloApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }

          struct ContentView: View {
              var body: some View {
                  VStack(spacing: 18) {
                      Text("Hello, Alex.")
                          .font(.largeTitle.weight(.semibold))
                      Text("PEAR built this iOS hello world from OpenClaw and shipped it through TestFlight.")
                          .font(.title3)
                          .multilineTextAlignment(.center)
                          .foregroundStyle(.secondary)
                      Text("Build \(Bundle.main.infoDictionary?["CFBundleVersion"] as? String ?? "")")
                          .font(.footnote.monospaced())
                          .foregroundStyle(.tertiary)
                  }
                  .padding(28)
              }
          }
          EOF

          xcodegen generate

      - name: Archive
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/openclaw-ios-hello
          xcodebuild archive \
            -project OpenClawHello.xcodeproj \
            -scheme OpenClawHello \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/OpenClawHello.xcarchive \
            DEVELOPMENT_TEAM="${TEAM_ID}" \
            CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${ASC_KEY_PATH}" \
            -authenticationKeyID "${ASC_KEY_ID}" \
            -authenticationKeyIssuerID "${ASC_ISSUER_ID}"

      - name: Export IPA
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/openclaw-ios-hello
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/OpenClawHello.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${ASC_KEY_PATH}" \
            -authenticationKeyID "${ASC_KEY_ID}" \
            -authenticationKeyIssuerID "${ASC_ISSUER_ID}"

      - name: Upload to TestFlight
        shell: bash
        run: |
          set -euo pipefail
          IPA="$(find /tmp/openclaw-ios-hello/build/export -name '*.ipa' -maxdepth 1 -print -quit)"
          if [[ -z "${IPA}" ]]; then
            echo "::error::No IPA exported."
            exit 1
          fi
          fastlane pilot upload \
            --ipa "${IPA}" \
            --app_identifier "${BUNDLE_ID}" \
            --api_key_path "${ASC_API_JSON}" \
            --skip_waiting_for_build_processing true

